name: Setup plugin PHP toolchain
description: >
  Sets up PHP 8.3 and installs this plugin's own Composer dependencies (phpcs, PHPStan, etc).
  Shared by the PHPCS and PHPStan jobs of ci.yml. cs2pr turns a checkstyle report into inline
  annotations on the pull request diff.

runs:
  using: composite
  steps:
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.3"
        tools: composer, cs2pr
        coverage: none
        extensions: mbstring, intl, curl, json

    - name: 📦 Composer cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/composer/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: 📥 Composer install (plugin)
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist
