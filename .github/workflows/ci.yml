name: CI

# The one verification pipeline. Pull requests to main run what their changes touch; a release
# (release.yml) and a manual run check everything. Nothing runs on push to main: the pull request
# was the gate, and the "require branches to be up to date" rule (.github/rulesets/main.json)
# makes the merged result exactly what was checked.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A newer push to the same pull request makes the running checks pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The oldest Moodle this plugin supports: keep in step with $plugin->requires in src/version.php
# (2024100700 = Moodle 4.5). The pinned, newest release comes from .env.example.
env:
  MOODLE_MIN_BRANCH: stable405
  MOODLE_MIN_VERSION: "4.5"

jobs:
  # Decides which checks a change needs, so a docs-only pull request costs seconds. Outside a pull
  # request (release, manual run) everything runs; so does any change to the CI itself.
  changes:
    name: 🧭 What changed
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.scope.outputs.php }}
      js: ${{ steps.scope.outputs.js }}
      tests: ${{ steps.scope.outputs.tests }}
      compat: ${{ steps.scope.outputs.compat }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Scope the checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed.txt"
          else
            git ls-files > "$RUNNER_TEMP/changed.txt"
          fi
          has() { grep -qE "$1" "$RUNNER_TEMP/changed.txt"; }

          all=false; php=false; js=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || has '^\.github/'; then all=true; fi
          # PHP checks: any plugin file (lang, templates and db feed the tests too), their configs,
          # and the Moodle pin.
          if $all || has '^src/|^phpcs\.xml$|^phpstan.*\.neon$|^composer\.(json|lock)$|^\.env\.example$'; then php=true; fi
          if $all || has '^src/amd/|^src/.*\.css$|^(eslint|stylelint)\.config\.cjs$|^package(-lock)?\.json$|^Gruntfile'; then js=true; fi
          tests=false
          if find src/tests -type f -name '*_test.php' 2>/dev/null | grep -q .; then tests=true; fi
          # The oldest supported Moodle is checked where compatibility is decided: a version.php
          # change (release preparation, schema change), a release, a manual run, a CI change.
          compat=false
          if $all || has '^src/version\.php$'; then compat=true; fi

          { echo "php=$php"; echo "js=$js"; echo "tests=$tests"; echo "compat=$compat"; } >> "$GITHUB_OUTPUT"
          {
            echo "### 🧭 Scope"
            echo "| Check | Runs |"
            echo "|---|---|"
            echo "| PHPCS, PHPStan | $php |"
            echo "| PHPUnit | $([ "$php" = true ] && [ "$tests" = true ] && echo true || echo false) |"
            echo "| ESLint, Stylelint, AMD build | $js |"
            echo "| Moodle ${MOODLE_MIN_VERSION} (oldest supported) | $compat |"
            echo
            echo "<details><summary>$(wc -l < "$RUNNER_TEMP/changed.txt") file(s) considered</summary>"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/changed.txt" | head -200
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  phpcs:
    name: 🐘 PHPCS
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP + plugin dependencies
        uses: ./.github/actions/setup-plugin-php

      # Same standard as `composer run lint`; the checkstyle copy becomes inline annotations.
      - name: ✅ Run PHPCS
        run: |
          set +e
          report="$RUNNER_TEMP/phpcs.xml"
          XDEBUG_MODE=off vendor/bin/phpcs --standard=phpcs.xml --report=full --report-checkstyle="$report" src
          rc=$?
          cs2pr --graceful-warnings "$report" || true
          read -r files errors warnings < <(python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          files = [f for f in root.iter('file') if len(f)]
          errors = sum(1 for e in root.iter('error') if e.get('severity') == 'error')
          print(len(files), errors, sum(1 for e in root.iter('error') if e.get('severity') == 'warning'))
          PY
          )
          {
            echo "### 🐘 PHPCS (Moodle CS)"
            [ "$rc" -eq 0 ] && echo "✅ No violations." || echo "❌ **$errors error(s)**, $warnings warning(s) in $files file(s) — see the annotations on the diff."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  phpstan:
    name: 🛡️ PHPStan
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP + plugin dependencies
        uses: ./.github/actions/setup-plugin-php

      # phpstan-moodle resolves core classes and globals against a real core (moodle.rootDirectory).
      - name: 🧱 Moodle core
        uses: ./.github/actions/setup-moodle-core

      # PHPStan's own result cache: unchanged files are not analysed again.
      - name: 📦 PHPStan result cache
        uses: actions/cache@v6
        with:
          path: .phpstan-cache
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      # Same as `composer run analyse`, with errors printed as annotations.
      - name: 🔍 Run PHPStan (level max)
        run: |
          set +e
          XDEBUG_MODE=off php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan.neon \
            --no-progress --error-format=github src | tee "$RUNNER_TEMP/phpstan.txt"
          rc=${PIPESTATUS[0]}
          count=$(grep -c '^::error' "$RUNNER_TEMP/phpstan.txt")
          {
            echo "### 🛡️ PHPStan (level max)"
            [ "$rc" -eq 0 ] && echo "✅ No errors." || echo "❌ **$count error(s)** — see the annotations on the diff."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  phpunit:
    name: 🧪 PHPUnit
    needs: changes
    if: needs.changes.outputs.php == 'true' && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    env:
      MOODLE_DIRROOT: /var/www/html
      DB_NAME: moodle
      DB_USER: root
      DB_PASS: rootpass

    services:
      mysql:
        image: mysql:8.4
        # The env context is not available under services; keep in sync with DB_PASS.
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        # tmpfs: the test database is throwaway, and disk-backed InnoDB slows init.php down.
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none
          extensions: mbstring, intl, curl, json, mysqli, zip, gd, xml, xmlreader, simplexml, dom, soap, sodium, openssl, iconv, fileinfo, ctype, tokenizer, exif
          ini-values: max_input_vars=5000, memory_limit=1G

      - name: 🧱 Moodle core
        id: core
        uses: ./.github/actions/setup-moodle-core
        with:
          dirroot: ${{ env.MOODLE_DIRROOT }}

      - name: 🧪 Plugin PHPUnit suite
        uses: ./.github/actions/run-plugin-phpunit
        with:
          dirroot: ${{ env.MOODLE_DIRROOT }}
          webroot: ${{ steps.core.outputs.webroot }}
          branch: ${{ steps.core.outputs.branch }}
          version: ${{ steps.core.outputs.version }}

  # The oldest supported Moodle: PHPStan for APIs that do not exist there (phpstan-compat.neon),
  # then the same PHPUnit suite on its runtime.
  compat:
    # Job names cannot read env: keep the version in the name in step with MOODLE_MIN_VERSION.
    name: 🧬 Moodle 4.5 (oldest supported)
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-24.04
    env:
      MOODLE_DIRROOT: /var/www/html
      DB_NAME: moodle
      DB_USER: root
      DB_PASS: rootpass

    services:
      mysql:
        image: mysql:8.4
        # Same service as the PHPUnit job; the env context is not available here, keep in sync with DB_PASS.
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        # tmpfs: the test database is throwaway, and disk-backed InnoDB slows init.php down.
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30


    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none
          extensions: mbstring, intl, curl, json, mysqli, zip, gd, xml, xmlreader, simplexml, dom, soap, sodium, openssl, iconv, fileinfo, ctype, tokenizer, exif
          ini-values: max_input_vars=5000, memory_limit=1G

      - name: 📥 Composer install (plugin tools)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🧱 Moodle core (oldest supported)
        id: core
        uses: ./.github/actions/setup-moodle-core
        with:
          dirroot: ${{ env.MOODLE_DIRROOT }}
          branch: ${{ env.MOODLE_MIN_BRANCH }}
          version: ${{ env.MOODLE_MIN_VERSION }}

      - name: 🔍 PHPStan (compatibility)
        run: |
          set +e
          XDEBUG_MODE=off php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan-compat.neon \
            --no-progress --error-format=github src | tee "$RUNNER_TEMP/phpstan.txt"
          rc=${PIPESTATUS[0]}
          count=$(grep -c '^::error' "$RUNNER_TEMP/phpstan.txt")
          {
            echo "### 🧬 Moodle ${MOODLE_MIN_VERSION}: PHPStan (compatibility)"
            [ "$rc" -eq 0 ] && echo "✅ No APIs missing on this release." || echo "❌ **$count error(s)** — see the annotations on the diff."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 🧪 Plugin PHPUnit suite
        if: success() || failure()
        uses: ./.github/actions/run-plugin-phpunit
        with:
          dirroot: ${{ env.MOODLE_DIRROOT }}
          webroot: ${{ steps.core.outputs.webroot }}
          branch: ${{ steps.core.outputs.branch }}
          version: ${{ steps.core.outputs.version }}

  js:
    name: 🔍 ESLint + Stylelint
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 📥 npm ci
        run: npm ci

      - name: 🔎 Run ESLint + Stylelint
        run: npm run lint

      # The release zips the committed src/amd/build as-is, so it must match src/amd/src.
      - name: 🧱 Verify amd/build/ matches amd/src/
        run: |
          npm run --silent build
          if ! git diff --exit-code --stat -- src/amd/build; then
            echo "::error::src/amd/build/ is out of date with src/amd/src/. Run 'npm run build' (or 'mdl build') and commit the result."
            exit 1
          fi

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "### 🔍 JS / CSS"
            [ "${{ job.status }}" = "success" ] && echo "✅ ESLint, Stylelint and the AMD build check passed." || echo "❌ See the failing step above."
          } >> "$GITHUB_STEP_SUMMARY"

  # The single required status check for main (see .github/rulesets/main.json). It always reports,
  # also when the checks above were skipped as irrelevant, which path-filtered workflows cannot do.
  result:
    name: CI result
    needs: [changes, phpcs, phpstan, phpunit, compat, js]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: ✅ Summarise and gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          icon = {'success': '✅', 'skipped': '⏭️', 'failure': '❌', 'cancelled': '🚫'}
          lines = ['### CI result', '| Job | Result |', '|---|---|']
          failed = []
          for job, data in needs.items():
              result = data.get('result', 'unknown')
              lines.append(f"| {job} | {icon.get(result, '❔')} {result} |")
              if result not in ('success', 'skipped'):
                  failed.append(job)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          if failed:
              print(f"::error::Failed or cancelled: {', '.join(failed)}")
              sys.exit(1)
          print('All required checks passed or were not needed.')
          PY
