# NOT an orchestrator: lint-php.yml, lint-js.yml, analyse-php.yml and
# test-phpunit.yml each already have their own pull_request/push triggers with
# path filters, so they run independently (and in parallel) as their own PR
# checks without any wrapper needed here — calling them via `uses:` on the
# same events would just run each of them a second time. This file only
# covers what those four don't: the convenience source-artifact upload.
# release.yml is the one place that *does* reuse them via `uses:`, gated
# sequentially — that's fine because a tag push never overlaps with a branch
# push/PR event, so there's no double-run there either.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload-source:
    name: ⬆️ Upload plugin source
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7
      - name: ⬆️ Upload plugin source
        uses: actions/upload-artifact@v7
        with:
          name: plugin-src-${{ github.sha }}-${{ github.run_number }}
          path: |
            src/**
          if-no-files-found: error
