name: Release

on:
  push:
    tags:
      - "v*" # e.g., v0.1.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-php:
    name: 🐘 PHP Lint
    uses: ./.github/workflows/lint-php.yml

  lint-js:
    name: 🔍 JS/CSS Lint
    uses: ./.github/workflows/lint-js.yml
    needs: lint-php

  analyse-php:
    name: 🛡️ PHPStan
    uses: ./.github/workflows/analyse-php.yml
    needs: lint-js

  test-phpunit:
    name: 🧪 PHPUnit
    uses: ./.github/workflows/test-phpunit.yml
    needs: analyse-php

  package:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test-phpunit]

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      # Create a plugin ZIP with the correct root folder name (ifthenpay/)
      - name: 📦 Zip plugin (no build — uses committed assets, verified by lint-js)
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          rsync -a --delete \
            --exclude=".DS_Store" \
            --exclude="Thumbs.db" \
            src/ dist/ifthenpay/
          (cd dist && zip -r ifthenpay-${GITHUB_REF_NAME}.zip ifthenpay)

      - name: ⬆️ Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip-${{ github.ref_name }}
          path: dist/ifthenpay-${{ github.ref_name }}.zip

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ifthenpay-${{ github.ref_name }}.zip
          generate_release_notes: true
